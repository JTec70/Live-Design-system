F=(id,lb,inp,r)=>`<div class="f" id="f_${id}"><label>${lb}${r?' <span class="rq">*</span>':''}</label>${inp}<div class="em"></div></div>`,
sel=(id,a,ph)=>`<select id="${id}"><option value="">${ph}</option>${a.map(o=>`<option>${o}</option>`).join('')}</select>`,

setSt=t=>{st=t;const e=$('#sv');if(e)e.textContent=t};
['click','keydown'].forEach(e=>addEventListener(e,bump));
function chk(rules){const bad={};let first=null;rules.forEach(([id,ok,m])=>{const f=$('#f_'+id);if(!f)return;if(!ok&&!bad[id]){bad[id]=1;f.classList.add('err');f.querySelector('.em').textContent=m;first=first||f}else if(!bad[id]){f.classList.remove('err');f.querySelector('.em').textContent=''}});if(first){(first.querySelector('input,select,textarea')||{focus(){}}).focus();return false}return true}
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const fail=e=>{console.error(e);const m=String(e&&e.message||e);alert(e&&e.user?m:/could not find the '(address|cep)' column/i.test(m)?'Falta rodar o arquivo endereco.sql no Supabase (veja o LEIA-ME). Depois, salve o contrato de novo.':/card_machines|card_fees|payment_fees|machine_id/i.test(m)?'Falta rodar o arquivo maquininhas.sql no Supabase (veja o LEIA-ME). Depois, tente de novo.':/could not find the '[a-z_]+' column/i.test(m)?'Falta rodar o arquivo especificacoes.sql no Supabase (veja o LEIA-ME). Depois, salve o contrato de novo.':/could not find the table|does not exist/i.test(m)?'Falta rodar o arquivo pagamentos.sql no Supabase (veja o LEIA-ME). Depois, salve o contrato de novo.':/duplicate|unique/i.test(m)?'Já existe um registro com este número/valor. Altere e tente de novo.':'Não foi possível concluir a operação. Confira sua conexão e tente de novo.\n('+m+')')};
const upd=async(t,id,o)=>{const {error}=await sb.from(t).update(o).eq('id',id);if(error)throw error},
ins=async(t,o)=>{const {data,error}=await sb.from(t).insert(o).select();if(error)throw error;return data},
del=async(t,id)=>{const {error}=await sb.from(t).delete().eq('id',id);if(error)throw error};
const wfN=z=>{const d=z.deadlines||[];return d.length===WF.length+1?{done:z.workflow_step>2?z.workflow_step-1:z.workflow_step,dl:[d[0],d[1],d[3],d[4],d[5]]}:{done:z.workflow_step,dl:d}};
async function load(){const r=await Promise.all([sb.from('profiles').select('*'),sb.from('leads').select('*'),sb.from('contracts').select('*'),sb.from('environments').select('*'),sb.from('expenses').select('*'),sb.from('settings').select('*'),me.role==='admin'?sb.from('audit_log').select('*').order('created_at',{ascending:false}).limit(200):Promise.resolve({data:[]}),sb.from('payments').select('*'),sb.from('card_machines').select('*'),sb.from('card_fees').select('*'),sb.from('payment_fees').select('*')]);
const bad=r.slice(0,7).find(x=>x.error);if(bad)throw bad.error;const [p,l,c,e,x,g,a,pm,mq,cf,pf]=r.map(z=>z.data||[]),nm={},pfm={};p.forEach(u=>nm[u.id]=u.name);pf.forEach(z=>pfm[z.payment_id]=z.fee_pct);

async function enter(u,role){const {data:p,error}=await sb.from('profiles').select('*').eq('id',u.id).single();

async function login(){if(Date.now()<lock){$('#er').textContent='Muitas tentativas. Aguarde 30 segundos.';return}

function parseXFallback(t,name){const clean=name.replace(/\.\w+$/,'');
const d=new DOMParser().parseFromString(t,'text/xml'),out=[];if(d.querySelector('parsererror'))return [{name:clean}];
const g=(e,ks)=>{for(const k of ks){const a=[...e.attributes].find(x=>x.name.toLowerCase()===k);if(a&&a.value)return a.value}return ''};
d.querySelectorAll('*').forEach(e=>{if(/^(ambiente|environment|room)/i.test(e.localName)){const n=g(e,['name','nome','description','descricao'])||e.querySelector('name,nome')?.textContent;if(n&&!out.some(o=>o.name===n.trim()))out.push({name:n.trim()})}});
if(out.length)return out;
const nItens=d.querySelectorAll('ITEM').length;
if(nItens)return [{name:'',desc:nItens+' item(ns) encontrados no arquivo. Confira e preencha o nome e a descrição do ambiente manualmente.'}];
return [{name:g(d.documentElement,['description','name','nome'])||clean}]}
/* Extrai, de forma fiel e sem interpretar, os dados de um orçamento Promob (formato LISTING > CATEGORY > ITEMS > ITEM).
Itens idênticos (mesma descrição e dimensão) são agrupados somando a quantidade — é apenas soma aritmética, não interpretação. */
function extractPromob(doc){
const root=doc.documentElement,dimUnit=root.getAttribute('UNIT')||'',amb=doc.querySelector('AMBIENT'),ambHint=amb?amb.getAttribute('DESCRIPTION')||'':'',cats=[];
doc.querySelectorAll('CATEGORY').forEach(cat=>{const nome=cat.getAttribute('DESCRIPTION')||'',map=new Map();
cat.querySelectorAll(':scope > ITEMS > ITEM').forEach(it=>{const desc=it.getAttribute('DESCRIPTION')||'',dims=it.getAttribute('TEXTDIMENSION')||'',k=desc+'|'+dims;
if(!map.has(k))map.set(k,{desc,dims,qty:0,unidadeQtd:it.getAttribute('UNIT')||'',familia:it.getAttribute('FAMILY')||'',grupo:it.getAttribute('GROUP')||''});
map.get(k).qty+=parseFloat(it.getAttribute('QUANTITY'))||0});
if(map.size)cats.push({categoria:nome,itens:[...map.values()]})});
return {unidadeDimensao:dimUnit,ambientePromobHint:ambHint,categorias:cats}}
function resumoPromob(doc){return extractPromob(doc).categorias.map(c=>c.categoria+': '+c.itens.length+' item(ns) distinto(s); maiores quantidades: '+[...c.itens].sort((a,b)=>b.qty-a.qty).slice(0,3).map(i=>i.qty+' '+(i.unidadeQtd||'')+' '+i.desc.trim()).join(', ')+'.').join(' ')}
async function xml(i){const f=i.files[0];if(!f)return;const r=new FileReader();
r.onload=()=>{const t=r.result;
if(/\.txt$/i.test(f.name)){tmp.push(...t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(n=>({name:n})));al();return}
let items=null;try{const doc=new DOMParser().parseFromString(t.replace(/^\uFEFF/,''),'text/xml');if(!doc.querySelector('parsererror')&&extractPromob(doc).categorias.length)items=[{name:'',desc:resumoPromob(doc).slice(0,600)}]}catch(e){}
if(!items)items=parseXFallback(t,f.name);
tmp.push(...items);i.value='';al()};r.readAsText(f)}

return `<div class="grid" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class="card"><b>Receita por vendedor</b><table>${sl.map(x=>`<tr><td>${esc(x.u.name)}<td>${brl(x.v)}<td class="sm">${x.u.meta?Math.round(x.v/x.u.meta*100)+'% da meta':'sem meta'}`).join('')}</table></div><div class="card"><b>Funil comercial</b>${ST.map((s,i)=>{const n=S.leads.filter(l=>l.st==i).length;return `<div class="sm" style="margin-top:8px">${s} · ${n}</div><div style="height:6px;border-radius:9px;background:var(--soft)"><div style="height:6px;border-radius:9px;background:var(--acc);width:${tot?n/tot*100:0}%"></div></div>`}).join('')}<p class="sm">${tot?Math.round(won/tot*100):0}% dos negócios estão em Ganho</p></div><div class="card"><b>Alertas de prazo</b><div class="big">${late}</div><div class="sm">projeto(s) com etapa atrasada</div><button class="btn g" style="margin-top:12px" onclick="view='wf';R()">Abrir radar</button></div></div>`}
const pwOk=p=>p.length>=8&&/\d/.test(p)&&/[A-Za-z]/.test(p);
async function fn(body,nome){const {data,error}=await sb.functions.invoke(nome||'admin-users',{body}),ue=m=>{const x=new Error(m);x.user=true;return x};
if(error){let st=0;try{st=error.context.status}catch(_){}
if(st===404||error.name==='FunctionsFetchError'||error.name==='FunctionsRelayError')throw ue(nome==='contract-reader'?'A função de leitura de contratos ainda não foi instalada no Supabase (veja o LEIA-ME).':'A função de usuários ainda não foi instalada no Supabase (veja o LEIA-ME, passo "Função de usuários").');
let m=error.message;try{const j=await error.context.json();if(j&&j.error)m=j.error}catch(_){}throw ue(m)}
if(data&&data.error)throw ue(data.error);return data}
V.usr=()=>{const mes=today().slice(0,7),L=[...S.users].sort((a,b)=>(a.role===b.role?0:a.role==='admin'?-1:1)||a.name.localeCompare(b.name));
return `<h1>Usuários</h1><p class="sm">Crie e remova acessos aqui, sem abrir o Supabase. Vendedores entram pelo ambiente Comercial e veem só os próprios negócios; administradores entram pelo ambiente Administrativo.</p>
<div class="card"><b>Novo acesso</b><div class="row" style="flex-wrap:wrap;align-items:flex-start">${F('u_n','Nome completo','<input id="u_n" autocomplete="off">',1)}${F('u_e','E-mail (será o login)','<input id="u_e" type="email" autocomplete="off">',1)}${F('u_p','Senha inicial','<input id="u_p" type="password" autocomplete="new-password">',1)}</div><div class="row" style="flex-wrap:wrap;align-items:flex-start">${F('u_r','Perfil','<select id="u_r" onchange="$(\'#f_u_m\').style.display=this.value==\'seller\'?\'\':\'none\'"><option value="seller">Vendedor (ambiente Comercial)</option><option value="admin">Administrador (ambiente Administrativo)</option></select>',1)}${F('u_m','Meta mensal (R$)','<input id="u_m" type="number" min="1">',1)}</div><button class="btn" style="margin-top:12px" onclick="addU()">Criar acesso</button></div>
<div class="card tw" style="margin-top:14px"><table><tr><th>Nome<th>E-mail<th>Perfil<th>Meta (R$)<th>Vendido no mês<th>Status<th></tr>${L.map(u=>`<tr><td><input value="${esc(u.name)}" onchange="setU('${u.id}',{name:this.value.trim()})">${u.id===me.id?' <span class="sm">(você)</span>':''}<td>${esc(u.login)}<td><span class="chip">${u.role=='admin'?'Administrador':'Vendedor'}</span><td>${u.role=='seller'?`<input type="number" min="1" value="${u.meta||''}" style="max-width:130px" onchange="setU('${u.id}',{meta:+this.value||0})">`:'—'}<td>${u.role=='seller'?brl(sum(S.ctr.filter(c=>c.seller==u.id&&c.date.startsWith(mes)),c=>c.val)):'—'}<td>${u.off?'<span class="chip bd">Inativo</span>':'<span class="chip ok">Ativo</span>'}<td style="white-space:nowrap"><a href="#" onclick="pwM('${u.id}');return false">Nova senha</a>${u.id===me.id?'':` · <a href="#" onclick="tgU('${u.id}');return false">${u.off?'Reativar':'Desativar'}</a> · <a href="#" style="color:var(--bad)" onclick="if(this.dataset.c)rmU('${u.id}');else{this.dataset.c=1;this.textContent='Confirmar remoção'}return false">Remover</a>`}`).join('')}</table></div><div class="card" style="margin-top:14px"><label>Meta mensal da loja (R$)</label><input type="number" min="1" value="${S.goal||''}" onchange="setGoal(this.value)" style="max-width:220px"></div>`};
async function addU(){const n=val('u_n'),e=val('u_e').toLowerCase(),p=$('#u_p').value,r=val('u_r'),m=+val('u_m');
if(!chk([['u_n',n.length>=3,'Informe o nome completo.'],['u_e',/^\S+@\S+\.\S+$/.test(e),'Informe um e-mail válido.'],['u_e',!S.users.some(u=>(u.login||'').toLowerCase()===e),'Já existe um acesso com este e-mail.'],['u_p',pwOk(p),'A senha precisa de 8+ caracteres, com letras e números.'],['u_m',r!=='seller'||m>0,'Informe a meta mensal do vendedor.']]))return;
await run(()=>fn({action:'create',name:n,email:e,password:p,role:r,meta:m}))}
async function setU(id,o){if('name' in o&&o.name.length<3){alert('Informe o nome completo.');R();return}await run(()=>upd('profiles',id,o))}
async function tgU(id){const u=S.users.find(x=>x.id==id);await run(()=>fn({action:'active',id,active:u.off}))}
async function rmU(id){await run(()=>fn({action:'remove',id}))}
function pwM(id){const u=S.users.find(x=>x.id==id);M(`<h2>Nova senha</h2><p class="sm">${esc(u.name)} (${esc(u.login)})</p>${F('n_p','Nova senha','<input id="n_p" type="password" autocomplete="new-password">',1)}<div class="row" style="margin-top:18px"><button class="btn g" onclick="X()">Cancelar</button><button class="btn" onclick="savePw('${id}')">Salvar senha</button></div>`)}
async function savePw(id){const p=$('#n_p').value;if(!chk([['n_p',pwOk(p),'A senha precisa de 8+ caracteres, com letras e números.']]))return;if(await run(()=>fn({action:'password',id,password:p})))X()}
async function setGoal(v){await run(async()=>{const {error}=await sb.from('settings').upsert({key:'goal',value:Math.max(1,+v||1)});if(error)throw error})}

V.log=()=>`<h1>Auditoria</h1><p class="sm">Últimas ações no sistema: quem fez, quando e o quê.</p><div class="card tw" style="margin-top:18px"><table><tr><th>Quando<th>Usuário<th>Ação</tr>${(S.log||[]).map(x=>`<tr><td>${new Date(x.t).toLocaleString('pt-BR')}<td>${esc(x.u)}<td>${esc(x.w)}`).join('')||'<tr><td colspan="3">Sem registros.'}</table></div>`;

boot();
</script></body></html>
